[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyframetree"
version = "0.3.0"
description = "Nested 3D coordinate frames with physical units and vectorized transformations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Gabriel Lefloch", email = "gabriel.lefloch@kit.edu"}]
dependencies = ["numpy>=1.24", "quantities>=0.16"]

[project.optional-dependencies]
visualization = ["pyvista>=0.43", "matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/gabs1234/QuaternionFrame"

[dependency-groups]
notebook = [
    "marimo>=0.25.2",
    "fastplotlib>=0.7,<0.8",
    "rendercanvas>=2.7.2,<2.8",
    "anywidget>=0.9",
    "ipython>=8",
    "simplejpeg>=1.8",
]

[tool.uv.dependency-groups]
notebook = {requires-python = ">=3.11"}

[tool.setuptools.packages.find]
include = ["pyframetree*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
